name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Lint (formatting)
        run: ./mvnw -B -ntp spotless:check
      - name: Tests (Testcontainers Postgres)
        run: ./mvnw -B -ntp verify
      - name: Test report
        if: always()
        run: |
          grep -h "Tests run" target/surefire-reports/*.txt | sort || true

  docker:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t payment-ledger-api:ci .
      - name: Smoke test (compose up, register, top up, reconcile)
        run: |
          docker compose --profile app up -d
          for i in $(seq 1 60); do curl -sf localhost:8080/actuator/health && break; sleep 2; done
          TOKEN=$(curl -sf -X POST localhost:8080/auth/register -H 'Content-Type: application/json' \
            -d '{"email":"ci@test.my","password":"ci-password-123"}' | jq -r .accessToken)
          curl -sf -X POST localhost:8080/wallets -H "Authorization: Bearer $TOKEN"
          curl -sf -X POST localhost:8080/wallets/me/topups -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' -H 'Idempotency-Key: ci-1' -d '{"amountSen":1000}'
          ADMIN=$(curl -sf -X POST localhost:8080/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"admin@ledger.local","password":"admin-dev-password"}' | jq -r .accessToken)
          curl -sf localhost:8080/admin/reconciliation -H "Authorization: Bearer $ADMIN" | tee /dev/stderr | jq -e .ok
      - name: Logs on failure
        if: failure()
        run: docker compose --profile app logs api
